
name: Cleanup Unit History Duplicates

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Preview duplicate cleanup
        run: |
          python scripts/cleanup_unit_history_duplicates.py

      - name: Upload cleanup report
        uses: actions/upload-artifact@v4
        with:
          name: duplicate-cleanup-report
          path: unit-history/duplicate_cleanup_report.json

      - name: Apply cleanup
        if: ${{ vars.APPROVE_UNIT_HISTORY_CLEANUP == 'true' }}
        run: |
          python scripts/cleanup_unit_history_duplicates.py --apply

      - name: Commit and push changes
        if: ${{ vars.APPROVE_UNIT_HISTORY_CLEANUP == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -u unit-history/events \
                     data/unit_history_index.json \
                     unit-history/manifest.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Remove duplicate Unit History events"
          git push
